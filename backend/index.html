<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Backend - Generated Entries</title>


  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      padding: 25px;

      background: #f5f7fb;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    .container {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      background: white;

      padding: 30px;

      border-radius: 25px;

      box-shadow:
        0 20px 50px rgba(0,0,0,.10);

    }


    h1 {

      margin-top: 0;

      color: #111827;

    }


    .header {

      padding: 15px;

      background: #eff6ff;

      color: #1d4ed8;

      border-radius: 12px;

      margin-bottom: 20px;

      font-weight: 600;

    }


    .entry {

      padding: 18px;

      margin-bottom: 12px;

      background: #f8fafc;

      border: 1px solid #e2e8f0;

      border-radius: 14px;

    }


    .identifier {

      font-family: monospace;

      font-size: 18px;

      font-weight: 600;

      color: #111827;

      word-break: break-all;

    }


    .time {

      margin-top: 7px;

      color: #64748b;

      font-size: 13px;

    }


    .empty {

      padding: 30px;

      text-align: center;

      color: #64748b;

    }


    .error {

      padding: 15px;

      background: #fee2e2;

      color: #991b1b;

      border-radius: 12px;

      word-break: break-word;

    }


    .back {

      display: inline-block;

      margin-top: 25px;

      color: #2563eb;

      text-decoration: none;

      font-weight: 600;

    }

  </style>

</head>


<body>


  <div class="container">

    <h1>📂 Backend</h1>


    <div class="header">

      Submitted entries

    </div>


    <div id="entries">

      Loading entries...

    </div>


    <a
      class="back"
      href="/"
    >
      ← Back to Generator
    </a>

  </div>


<script>


/*
 * Firebase configuration
 */

const firebaseConfig = {

  apiKey:
    "AIzaSyAjOSPJVsEzbgTWxWXwrOZpdHzdMai-CI",

  authDomain:
    "agentrouter-9c9df.firebaseapp.com",

  projectId:
    "agentrouter-9c9df",

  storageBucket:
    "agentrouter-9c9df.firebasestorage.app",

  messagingSenderId:
    "152852199619",

  appId:
    "1:152852199619:web:8a60e89492ffea32ec4a76"

};


firebase.initializeApp(firebaseConfig);


const db =
  firebase.firestore();


const entries =
  document.getElementById("entries");


async function loadEntries() {

  entries.innerHTML =
    "Loading entries...";


  try {


    const snapshot =
      await db
        .collection("generated_entries")
        .orderBy("createdAt", "desc")
        .get();


    if (snapshot.empty) {

      entries.innerHTML = `
        <div class="empty">
          No entries have been generated yet.
        </div>
      `;

      return;

    }


    entries.innerHTML = "";


    snapshot.forEach((doc) => {

      const data =
        doc.data();


      const entry =
        document.createElement("div");

      entry.className =
        "entry";


      const identifier =
        document.createElement("div");

      identifier.className =
        "identifier";


      identifier.textContent =
        data.identifier || "Unknown";


      const time =
        document.createElement("div");

      time.className =
        "time";


      if (data.createdAt) {

        time.textContent =
          data.createdAt
            .toDate()
            .toLocaleString();

      }

      else {

        time.textContent =
          "Just now";

      }


      entry.appendChild(identifier);

      entry.appendChild(time);

      entries.appendChild(entry);

    });


  }

  catch (error) {

    console.error(
      "Backend Firebase error:",
      error
    );


    entries.innerHTML = `
      <div class="error">
        <strong>Firebase error</strong><br><br>
        ${error.message}
      </div>
    `;

  }

}


loadEntries();

</script>


</body>

</html>
