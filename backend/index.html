
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Backend</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 20px;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  background: #0b0b0b;
  border: 1px solid #222;
  border-radius: 20px;
  padding: 30px;
}

h1 {
  margin: 0 0 8px;
  font-size: 30px;
  color: #fff;
}

.subtitle {
  color: #888;
  margin-bottom: 25px;
}

.status {
  background: #111;
  border: 1px solid #222;
  color: #ccc;
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.entry {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  margin-bottom: 10px;
  background: #111;
  border: 1px solid #252525;
  border-radius: 12px;
}

.value {
  flex: 1;
  min-width: 0;
  color: #fff;
  font-family: monospace;
  font-size: 16px;
  word-break: break-all;
}

.time {
  color: #666;
  font-size: 12px;
  margin-top: 5px;
}

.copy-btn {
  flex-shrink: 0;
  background: #fff;
  color: #000;
  border: none;
  padding: 9px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.copy-btn:hover {
  background: #ddd;
}

.empty {
  color: #777;
  text-align: center;
  padding: 30px;
}

.error {
  color: #ff6b6b;
  background: #1a0808;
  border: 1px solid #3a1111;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Backend</h1>

  <div class="subtitle">
    Submitted entries
  </div>

  <div class="status">
    Entries received from the generator
  </div>

  <div id="entries">
    Loading...
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAjOSPJVsEzbgTWxWXwrOZpdHzdMai-CI",
  authDomain: "agentrouter-9c9df.firebaseapp.com",
  projectId: "agentrouter-9c9df",
  storageBucket: "agentrouter-9c9df.firebasestorage.app",
  messagingSenderId: "152852199619",
  appId: "1:152852199619:web:8a60e89492ffea32ec4a76"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const entries = document.getElementById("entries");

async function loadEntries() {

  try {

    const snapshot = await db
      .collection("generated_entries")
      .orderBy("createdAt", "desc")
      .get();

    if (snapshot.empty) {
      entries.innerHTML =
        '<div class="empty">No entries yet.</div>';
      return;
    }

    entries.innerHTML = "";

    snapshot.forEach(doc => {

      const data = doc.data();

      const entry = document.createElement("div");
      entry.className = "entry";

      const content = document.createElement("div");
      content.style.flex = "1";

      const value = document.createElement("div");
      value.className = "value";

      /*
       * For non-sensitive text/IDs, use the complete
       * submitted value stored in Firebase.
       */
      value.textContent =
        data.value || data.identifier || "";

      const time = document.createElement("div");
      time.className = "time";

      if (data.createdAt) {
        time.textContent =
          data.createdAt.toDate().toLocaleString();
      } else {
        time.textContent = "Just now";
      }

      content.appendChild(value);
      content.appendChild(time);

      const copy = document.createElement("button");
      copy.className = "copy-btn";
      copy.textContent = "Copy";

      copy.addEventListener("click", async () => {

        try {

          await navigator.clipboard.writeText(
            value.textContent
          );

          copy.textContent = "Copied";

          setTimeout(() => {
            copy.textContent = "Copy";
          }, 1500);

        } catch (error) {

          console.error(error);
          copy.textContent = "Failed";

          setTimeout(() => {
            copy.textContent = "Copy";
          }, 1500);

        }

      });

      entry.appendChild(content);
      entry.appendChild(copy);

      entries.appendChild(entry);

    });

  } catch (error) {

    console.error(error);

    entries.innerHTML = `
      <div class="error">
        Unable to load entries: ${error.message}
      </div>
    `;

  }

}

loadEntries();

</script>

</body>
</html>
