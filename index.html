<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings Generator</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;

      background: #0d0d0d;
      border: 1px solid #242424;
      border-radius: 20px;

      padding: 30px;

      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .description {
      color: #999;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input {
      width: 100%;

      padding: 15px;

      background: #050505;
      color: white;

      border: 1px solid #333;
      border-radius: 10px;

      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #666;
    }

    #generateBtn {
      width: 100%;

      margin-top: 12px;

      padding: 15px;

      background: white;
      color: black;

      border: none;
      border-radius: 10px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    #generateBtn:hover {
      background: #ddd;
    }

    #generateBtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #outputArea {
      display: none;
      margin-top: 25px;
    }

    pre {
      background: #050505;
      color: #ddd;

      border: 1px solid #292929;
      border-radius: 12px;

      padding: 20px;

      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;

      font-family: monospace;
      line-height: 1.5;
    }

    #copyBtn {
      margin-top: 12px;

      padding: 12px 18px;

      background: #222;
      color: white;

      border: 1px solid #444;
      border-radius: 10px;

      cursor: pointer;
    }

    #copyBtn:hover {
      background: #333;
    }

    #success {
      display: none;

      margin-top: 12px;

      padding: 12px;

      background: #102515;
      color: #8ee69b;

      border: 1px solid #1d5728;
      border-radius: 10px;
    }

    #error {
      display: none;

      margin-top: 12px;

      padding: 12px;

      background: #251010;
      color: #ff9999;

      border: 1px solid #572020;
      border-radius: 10px;
    }

    .backend-link {
      display: block;

      margin-top: 25px;

      color: #aaa;
      text-decoration: none;
      text-align: center;
    }

    .backend-link:hover {
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Settings Generator</h1>

  <p class="description">
    Enter your value and generate the settings configuration.
  </p>

  <input
    id="keyInput"
    type="text"
    placeholder="Enter your value"
    autocomplete="off"
  >

  <button id="generateBtn">
    Generate
  </button>


  <!-- Generated JSON -->
  <div id="outputArea">

    <pre id="jsonOutput"></pre>

    <button id="copyBtn">
      Copy settings.json
    </button>

    <div id="success">
      Generated Successfully
    </div>

    <div id="error"></div>

  </div>


  <a
    href="/backend/"
    class="backend-link"
  >
    Open Backend
  </a>

</div>


<script>

  /*
   * FIREBASE CONFIG
   */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAjOSPJVsEzbgTWxWXwrOZpdHzdMai-CI",

    authDomain:
      "agentrouter-9c9df.firebaseapp.com",

    projectId:
      "agentrouter-9c9df",

    storageBucket:
      "agentrouter-9c9df.firebasestorage.app",

    messagingSenderId:
      "152852199619",

    appId:
      "1:152852199619:web:8a60e89492ffea32ec4a76"

  };


  /*
   * INITIALIZE FIREBASE
   */

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();


  /*
   * DOM ELEMENTS
   */

  const keyInput =
    document.getElementById("keyInput");

  const generateBtn =
    document.getElementById("generateBtn");

  const outputArea =
    document.getElementById("outputArea");

  const jsonOutput =
    document.getElementById("jsonOutput");

  const copyBtn =
    document.getElementById("copyBtn");

  const success =
    document.getElementById("success");

  const errorBox =
    document.getElementById("error");


  /*
   * GENERATE BUTTON
   */

  generateBtn.addEventListener("click", async () => {

    const value =
      keyInput.value.trim();


    /*
     * Don't generate if empty
     */

    if (!value) {

      alert("Please enter a value first.");

      return;

    }


    generateBtn.disabled = true;

    generateBtn.textContent =
      "Generating...";


    /*
     * BUILD THE SETTINGS JSON
     *
     * The COMPLETE input is used here.
     *
     * This stays in the browser and is
     * NOT sent to Firebase.
     */

    const settings = {

      env: {

        ANTHROPIC_AUTH_TOKEN:
          value,

        ANTHROPIC_BASE_URL:
          "https://agentrouter.org",

        ANTHROPIC_MODEL:
          "claude-opus-4-8",

        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:
          "1"

      },

      permissions: {

        allow: [],

        deny: []

      },

      effortLevel:
        "high"

    };


    /*
     * Convert object to JSON
     */

    const json =
      JSON.stringify(
        settings,
        null,
        2
      );


    /*
     * SHOW GENERATED JSON
     */

    jsonOutput.textContent =
      json;

    outputArea.style.display =
      "block";


    /*
     * IMPORTANT:
     *
     * Create a MASKED version.
     *
     * Example:
     *
     * Input:
     * TEST_KEY_123456
     *
     * Firebase receives:
     * ••••••••3456
     *
     * The complete input is NOT stored.
     */

    const masked =
      value.length >= 4
        ? "••••••••" + value.slice(-4)
        : "••••••••";


    /*
     * SAVE ONLY THE MASKED VALUE
     * TO FIREBASE
     */

    try {

      await db
        .collection("generated_entries")
        .add({

          identifier: masked,

          createdAt:
            firebase.firestore.FieldValue
              .serverTimestamp()

        });


      /*
       * Firebase successfully saved
       */

      success.style.display =
        "block";

      errorBox.style.display =
        "none";


    } catch (error) {

      console.error(
        "Firebase error:",
        error
      );


      /*
       * JSON still works even if
       * Firebase fails.
       */

      success.style.display =
        "block";

      success.textContent =
        "Generated Successfully";


      errorBox.textContent =
        "The settings were generated, but Firebase could not save the entry.";

      errorBox.style.display =
        "block";

    }


    generateBtn.disabled =
      false;

    generateBtn.textContent =
      "Generate";

  });


  /*
   * COPY GENERATED JSON
   */

  copyBtn.addEventListener(
    "click",
    async () => {

      try {

        await navigator.clipboard.writeText(
          jsonOutput.textContent
        );

        copyBtn.textContent =
          "Copied";

        setTimeout(() => {

          copyBtn.textContent =
            "Copy settings.json";

        }, 2000);

      } catch (error) {

        alert(
          "Could not copy the settings."
        );

      }

    }
  );

</script>

</body>
</html>
