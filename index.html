<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings Generator</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f5f7fb;
  font-family:system-ui,sans-serif;
}
.container{
  width:100%;
  max-width:800px;
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 15px 40px #0002;
}
h1{margin-top:0;color:#172033}
input{
  width:100%;
  padding:15px;
  border:1px solid #ccd4df;
  border-radius:12px;
  font-size:16px;
}
button{
  border:0;
  border-radius:12px;
  padding:13px 20px;
  cursor:pointer;
  font-size:15px;
}
.generate{
  margin-top:12px;
  background:#2563eb;
  color:white;
}
.code{
  display:none;
  margin-top:25px;
  padding:20px;
  border-radius:15px;
  background:#101827;
  color:#e5e7eb;
  white-space:pre-wrap;
  overflow:auto;
  font-family:monospace;
}
.copy{
  display:none;
  margin-top:12px;
  background:#172033;
  color:white;
}
.success{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#dcfce7;
  color:#166534;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ Settings Generator</h1>

<p>Enter your value and generate the configuration.</p>

<input
  id="input"
  type="text"
  placeholder="Enter value"
/>

<button class="generate" id="generate">
Generate
</button>

<pre class="code" id="output"></pre>

<button class="copy" id="copy">
📋 Copy settings.json
</button>

<div class="success" id="success">
✅ Generated Successfully
</div>

</div>

<script>
const input = document.getElementById("input");
const generate = document.getElementById("generate");
const output = document.getElementById("output");
const copy = document.getElementById("copy");
const success = document.getElementById("success");

generate.addEventListener("click", async () => {

  const value = input.value.trim();

  if (!value) {
    alert("Please enter a value first.");
    return;
  }

  generate.disabled = true;
  generate.textContent = "Generating...";

  try {

    const settings = {
      env: {
        ANTHROPIC_AUTH_TOKEN: value,
        ANTHROPIC_BASE_URL: "https://agentrouter.org",
        ANTHROPIC_MODEL: "claude-opus-4-8",
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      },
      permissions: {
        allow: [],
        deny: []
      },
      effortLevel: "high"
    };

    /*
      Store only a non-sensitive identifier.
      The actual value is NOT sent to Firebase.
    */
    const identifier =
      value.length >= 4
        ? "••••" + value.slice(-4)
        : "••••";

    await db.collection(COLLECTION).add({
      identifier: identifier,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    const json = JSON.stringify(settings, null, 2);

    output.textContent = json;
    output.style.display = "block";

    copy.style.display = "inline-block";
    success.style.display = "block";

  } catch (error) {

    console.error(error);

    alert(
      "Generation failed: " +
      (error.message || "Firebase error")
    );

  } finally {

    generate.disabled = false;
    generate.textContent = "Generate";

  }
});

copy.addEventListener("click", async () => {

  await navigator.clipboard.writeText(output.textContent);

  copy.textContent = "✅ Copied!";

  setTimeout(() => {
    copy.textContent = "📋 Copy settings.json";
  }, 2000);

});
</script>

</body>
</html>
