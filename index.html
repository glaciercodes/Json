<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aeb4c0;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #303642;
      border-radius: 8px;
      background: #181c24;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6c8cff;
    }

    #generateBtn {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #generateBtn:hover {
      opacity: 0.9;
    }

    #outputArea {
      margin-top: 25px;
    }

    #jsonOutput {
      padding: 20px;
      min-height: 150px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: #080a0f;
      border: 1px solid #303642;
      border-radius: 8px;
      color: #d8e0ff;
    }

    #copyBtn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #303642;
      border-radius: 8px;
      background: #181c24;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    #copyBtn:hover {
      background: #222733;
    }

    #success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #12351f;
      color: #6ff28d;
    }

    #firebaseError {
      margin-top: 12px;
      color: #ff6b6b;
    }

    .backend-link {
      display: inline-block;
      margin-top: 25px;
      color: #8ea2ff;
      text-decoration: none;
    }

    .backend-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⚡ Settings Generator</h1>

    <p>
      Enter your value and generate the configuration.
    </p>

    <input
      id="keyInput"
      type="text"
      placeholder="Enter your value"
      autocomplete="off"
    >

    <button id="generateBtn">
      Generate
    </button>

    <div id="outputArea">

      <pre id="jsonOutput"></pre>

      <button id="copyBtn">
        📋 Copy settings.json
      </button>

      <div id="success">
        ✅ Generated Successfully
      </div>

      <div id="firebaseError"></div>

    </div>

    <a
      class="backend-link"
      href="/backend/"
    >
      📂 Open Backend
    </a>

  </div>

  <script>
    // Get the actual elements from the page
    const keyInput = document.getElementById("keyInput");
    const generateBtn = document.getElementById("generateBtn");
    const jsonOutput = document.getElementById("jsonOutput");
    const copyBtn = document.getElementById("copyBtn");
    const success = document.getElementById("success");
    const firebaseError = document.getElementById("firebaseError");


    // ================================
    // GENERATE SETTINGS
    // ================================

    generateBtn.addEventListener("click", function () {

      // Get the REAL value typed by the user
      const userValue = keyInput.value.trim();

      // Check if input is empty
      if (userValue === "") {

        jsonOutput.textContent = "";
        success.style.display = "none";

        firebaseError.textContent =
          "❌ Please enter a value first.";

        return;
      }


      // Create settings using the REAL input
      const settings = {
        env: {
          ANTHROPIC_AUTH_TOKEN: userValue,
          ANTHROPIC_BASE_URL: "https://agentrouter.org",
          ANTHROPIC_MODEL: "claude"
        }
      };


      // Convert object to JSON
      const json = JSON.stringify(settings, null, 2);


      // Show generated JSON
      jsonOutput.textContent = json;


      // Show success message
      success.style.display = "block";

      // Clear error
      firebaseError.textContent = "";

    });


    // ================================
    // COPY SETTINGS
    // ================================

    copyBtn.addEventListener("click", async function () {

      const json = jsonOutput.textContent;


      // Don't copy if nothing has been generated
      if (!json.trim()) {

        firebaseError.textContent =
          "❌ Generate the settings first.";

        return;
      }


      try {

        await navigator.clipboard.writeText(json);

        copyBtn.textContent = "✅ Copied!";

        firebaseError.textContent = "";


        // Change button back after 2 seconds
        setTimeout(function () {

          copyBtn.textContent =
            "📋 Copy settings.json";

        }, 2000);


      } catch (error) {

        firebaseError.textContent =
          "❌ Could not copy automatically. Please copy the JSON manually.";

      }

    });


    // ================================
    // ALLOW ENTER KEY TO GENERATE
    // ================================

    keyInput.addEventListener("keydown", function (event) {

      if (event.key === "Enter") {

        generateBtn.click();

      }

    });

  </script>

</body>
</html>
